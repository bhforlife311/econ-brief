name: 발행

# 루틴이 main에 직접 못 밀고 claude/… 브랜치로 밀어도 사이트가 갱신되도록 처리한다.
#   ff     — claude/** 푸시를 main으로 fast-forward. 환경 게이트가 없어 어느 브랜치에서도 돈다.
#   deploy — 그 트리를 Pages에 배포. github-pages 환경을 쓰므로 환경의 배포 브랜치 규칙을 탄다.
# 두 job을 나눈 이유: 배포가 막히더라도 main 병합만은 반드시 성공시키기 위함.
on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ff:
    name: main으로 fast-forward
    if: startsWith(github.ref, 'refs/heads/claude/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -euo pipefail
          git fetch origin main
          if git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            git push origin "$GITHUB_SHA:main"
            echo "main을 $GITHUB_SHA 로 이동했습니다."
          else
            echo "::error::main이 이 브랜치의 조상이 아닙니다. 갈라졌으니 자동 병합하지 않습니다."
            exit 1
          fi

  deploy:
    name: Pages 배포
    needs: [ff]
    # ff가 건너뛰어도(main 직접 푸시) 배포는 해야 한다
    if: always() && (needs.ff.result == 'success' || needs.ff.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 산출물 점검
        run: |
          set -euo pipefail
          test -f index.html || { echo "::error::index.html이 없습니다."; exit 1; }
          head -c 20 index.html | grep -qi '<!doctype html>' || { echo "::error::index.html이 <!doctype html>로 시작하지 않습니다."; exit 1; }
          grep -q '</html>' index.html || { echo "::error::index.html이 </html>로 끝나지 않습니다."; exit 1; }
          grep -q '<style>' index.html || { echo "::error::<style> 블록이 사라졌습니다."; exit 1; }
          echo "점검 통과."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
