name: 발행

# 루틴이 main에 직접 못 밀고 claude/… 브랜치로 밀어도 사이트가 갱신되도록,
# 두 경우를 한 번의 실행에서 모두 처리한다.
#   1) claude/** 로 푸시되면 main을 그 커밋으로 fast-forward
#   2) 어느 쪽이든 그 트리를 그대로 Pages에 배포
on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 연달아 발행돼도 마지막 것만 살린다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: main으로 fast-forward
        if: startsWith(github.ref, 'refs/heads/claude/')
        run: |
          set -euo pipefail
          git fetch origin main
          if git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            git push origin "$GITHUB_SHA:main"
            echo "main을 $GITHUB_SHA 로 이동했습니다."
          else
            echo "::error::main이 이 브랜치의 조상이 아닙니다. 갈라졌으니 자동 병합하지 않습니다. 수동으로 확인하세요."
            exit 1
          fi

      - name: 산출물 점검
        run: |
          set -euo pipefail
          test -f index.html || { echo "::error::index.html이 없습니다."; exit 1; }
          head -c 20 index.html | grep -qi '<!doctype html>' || { echo "::error::index.html이 <!doctype html>로 시작하지 않습니다."; exit 1; }
          grep -q '</html>' index.html || { echo "::error::index.html이 </html>로 끝나지 않습니다."; exit 1; }
          grep -q '<style>' index.html || { echo "::error::<style> 블록이 사라졌습니다."; exit 1; }
          echo "점검 통과."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
